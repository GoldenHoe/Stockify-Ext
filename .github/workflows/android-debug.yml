name: Android Debug Build

# 手动触发：Actions → Android Debug Build → Run workflow
# 产物在运行页面的 Artifacts 区域下载（保留 14 天）。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支 / 标签 / 提交（留空则使用触发时的提交）"
        required: false
        type: string
      run_tests:
        description: "同时运行 debug 单元测试"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      # 先尝试预装平台与 build-tools；失败时由 AGP 自行下载缺失组件。
      - name: 安装 Android SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0" \
            || echo "预装失败，交由 AGP 自动下载"
          sdkmanager --list_installed | head -20 || true

      - name: 环境信息
        run: |
          java -version
          chmod +x gradlew
          ./gradlew --version

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 单元测试
        if: ${{ inputs.run_tests }}
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: 整理产物
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          version=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          version=${version:-unknown}
          sha=$(git rev-parse --short HEAD)
          apk="stockify-ext-debug-${version}-${sha}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${apk}"
          sha256sum "dist/${apk}" | tee dist/SHA256SUMS.txt
          size=$(du -h "dist/${apk}" | cut -f1)
          echo "apk=${apk}" >> "$GITHUB_OUTPUT"
          {
            echo "### Android Debug Build"
            echo ""
            echo "- 版本：${version}"
            echo "- 提交：${sha}"
            echo "- 产物：\`${apk}\`（${size}）"
            echo "- 校验：\`SHA256SUMS.txt\`"
            echo ""
            echo "> 产物在本次运行页面的 **Artifacts** 区域下载。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: stockify-ext-debug-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
